name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build linux ${{ matrix.arch }}
    # The binary links glibc and libX11 dynamically: building on the oldest
    # supported runner keeps the glibc symbol versions it needs low, so it
    # also runs on older distributions.
    runs-on: ${{ matrix.runner }}
    env:
      UPX_VERSION: "5.2.0"
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            upx_sha256: "3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1"
          - arch: arm64
            runner: ubuntu-22.04-arm
            upx_sha256: "55d48a61e8ffd17152db871c855376cba7f08e830b37799d0947a16dff8ec36c"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check version
        run: |
          version="$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/c-xpra.spec)"
          if [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the spec file version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxfixes-dev

      - name: Install UPX
        run: |
          archive="${RUNNER_TEMP}/upx.tar.xz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-${{ matrix.arch }}_linux.tar.xz"
          echo "${{ matrix.upx_sha256 }}  ${archive}" | sha256sum --check -
          tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/upx-${UPX_VERSION}-${{ matrix.arch }}_linux" >> "${GITHUB_PATH}"

      - name: Test
        run: make CFLAGS="-Os -Werror" test

      - name: Build
        run: |
          make CFLAGS="-Os -Werror" upx
          upx --test c-xpra
          ls -l c-xpra
          mkdir -p dist
          tar -czf "dist/c-xpra-linux-${{ matrix.arch }}.tar.gz" c-xpra

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: c-xpra-linux-${{ matrix.arch }}
          path: dist/c-xpra-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: c-xpra-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum c-xpra-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
